name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Permanently Remove text_to_speech
        run: |
          python3 -c '
          import glob, os

          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  for line in lines:
                      if "text_to_speech" not in line:
                          f.write(line)

          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              
              new_lines = []
              for line in lines:
                  if any(k in line.lower() for k in ["text_to_speech", "fluttertts", "tts"]):
                      new_lines.append("// " + line.strip() + " // removed\n")
                  else:
                      new_lines.append(line)
              
              with open(filepath, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
