name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Kotlin Version and SDK for Plugins (Safe Python Script)
        run: |
          python3 -c '
          import glob, re, os

          # 1. Set compileSdk to 34 in app build.gradle
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", content)
                  content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. Fix Kotlin version in text_to_speech and add namespace if needed
          for filepath in glob.glob("/home/runner/.pub-cache/**/text_to_speech-*/android/build.gradle", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  content = content.replace("1.3.50", "1.8.22")
                  if "android {" in content and "namespace" not in content:
                      content = content.replace("android {", "android {\n    namespace \"net.mikespub.flutter.plugins.texttospeech\"")
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
              except Exception:
                  pass

          # 3. Remove package attribute from plugin Manifests
          for manifest_path in glob.glob("/home/runner/.pub-cache/**/text_to_speech-*/android/src/main/AndroidManifest.xml", recursive=True):
              try:
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(r"package=\"[^\"]*\"", "", content)
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(content)
              except Exception:
                  pass
          '

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
