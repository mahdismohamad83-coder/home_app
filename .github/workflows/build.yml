name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Comprehensive Fix for Gradle 8 and Legacy Plugins
        run: |
          echo "Patching .module to .create in pub-cache and android..."
          find ~/.pub-cache -type f \( -name "*.gradle" -o -name "*.groovy" -o -name "*.kts" \) -exec sed -i 's/\.module(/\.create(/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.groovy" -o -name "*.kts" \) -exec sed -i 's/\.module(/\.create(/g' {} +

          echo "Fixing text_to_speech namespace and kotlin version..."
          find ~/.pub-cache -type d -name "text_to_speech-*" | while read dir; do
            gradle_file="$dir/android/build.gradle"
            if [ -f "$gradle_file" ]; then
              if ! grep -q "namespace" "$gradle_file"; then
                sed -i '/android {/a \    namespace "net.mikespub.flutter.plugins.texttospeech"' "$gradle_file"
              fi
              sed -i 's/1\.3\.50/1.8.22/g' "$gradle_file"
              sed -i 's/kotlin-gradle-plugin:[0-9.]\+/kotlin-gradle-plugin:1.8.22/g' "$gradle_file"
            fi
          done

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
