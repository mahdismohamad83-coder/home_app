name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix SDK 34 and text_to_speech Kotlin Version
        run: |
          # تنظیم compileSdk روی 34 برای پکیج image_picker
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk [0-9]\+/compileSdk 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' android/app/build.gradle
          fi

          # اصلاح نسخه‌ی کاتلین پکیج text_to_speech از 1.3.50 به 1.8.22
          find ~/.pub-cache -path "*/text_to_speech-*/android/build.gradle" -exec sed -i 's/1\.3\.50/1.8.22/g' {} \;
          find ~/.pub-cache -path "*/text_to_speech-*/android/build.gradle" -exec sed -i 's/kotlin-gradle-plugin:[0-9]\+\.[0-9]\+\.[0-9]\+/kotlin-gradle-plugin:1.8.22/g' {} \;

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
