name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Safely Remove text_to_speech via Python
        run: |
          python3 -c '
          import glob, os

          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  for line in lines:
                      if "text_to_speech" not in line:
                          f.write(line)

          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()
              
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "text_to_speech" in line:
                      continue
                  if ".speak(" in line or "TextToSpeech" in line:
                      new_lines.append("// " + line + " // removed")
                  else:
                      new_lines.append(line)
              
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("\n".join(new_lines) + "\n")
          '
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
