name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Ultimate All-in-One Fixer (Python)
        run: |
          python3 -c '
          import glob, re, os

          # 1. Remove text_to_speech from pubspec.yaml
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  skip = False
                  for line in lines:
                      if "text_to_speech" in line:
                          skip = True
                          continue
                      if skip:
                          if line.strip() and not line.startswith("  "):
                              skip = False
                          else:
                              continue
                      f.write(line)

          # 2. Comment out text_to_speech/tts usages in lib/ safely
          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  new_lines = []
                  for line in lines:
                      if any(k in line.lower() for k in ["text_to_speech", "fluttertts", "tts.", ".speak(", ".setlanguage("]):
                          new_lines.append("// [REMOVED] " + line.strip() + "\n")
                      else:
                          new_lines.append(line)
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
              except Exception:
                  pass

          # 3. Fix compileSdk in android/app/build.gradle
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", content)
                  content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 4. Global Gradle & Kotlin & Namespace fixer
          all_gradle_files = glob.glob("/home/runner/.pub-cache/**/*.gradle", recursive=True) + \
                             glob.glob("/home/runner/.pub-cache/**/*.kts", recursive=True) + \
                             glob.glob("android/**/*.gradle", recursive=True) + \
                             glob.glob("android/**/*.kts", recursive=True)

          for filepath in all_gradle_files:
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  
                  original = content
                  content = re.sub(r"\bmodule\s*\(", "create(", content)
                  content = content.replace("1.3.50", "1.8.22")
                  content = content.replace("1.7.10", "1.8.22")
                  
                  if "android {" in content and "namespace" not in content and "text_to_speech" in filepath:
                      content = content.replace("android {", "android {\n    namespace \"net.mikespub.flutter.plugins.texttospeech\"")
                  
                  if content != original:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
              except Exception:
                  pass

          # 5. Remove package attribute from AndroidManifest in plugins
          for manifest_path in glob.glob("/home/runner/.pub-cache/**/AndroidManifest.xml", recursive=True):
              try:
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = re.sub(r"package=\"[^\"]*\"", "", content)
                  if new_content != content:
                      with open(manifest_path, "w", encoding="utf-8") as f:
                          f.write(new_content)
              except Exception:
                  pass
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
