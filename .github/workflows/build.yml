name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force Inject Namespace into text_to_speech
        run: |
          TTS_PATH=$(find ~/.pub-cache -type d -name "text_to_speech-*" | head -n 1)
          if [ -d "$TTS_PATH" ]; then
            GRADLE_FILE="$TTS_PATH/android/build.gradle"
            if [ -f "$GRADLE_FILE" ]; then
              if ! grep -q "namespace" "$GRADLE_FILE"; then
                echo "" >> "$GRADLE_FILE"
                echo "android { namespace 'net.mikespub.flutter.plugins.texttospeech' }" >> "$GRADLE_FILE"
              fi
            fi
          fi

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
