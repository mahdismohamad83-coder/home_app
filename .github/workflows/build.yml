name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Clean and Setup Gradle 7.5
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

          # Force Gradle 7.5 for full compatibility with plugins
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-7.5-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix SDK 34 and Kotlin Compatibility (Python)
        run: |
          python3 -c '
          import os, re, glob

          # 1. Set compileSdk to 34
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", content)
                  content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. Fix Kotlin version in pub-cache if needed
          for filepath in glob.glob("/home/runner/.pub-cache/**/*.gradle", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  if "1.3.50" in content:
                      content = content.replace("1.3.50", "1.8.22")
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
              except Exception:
                  pass
          '

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
