name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle 8 .module Issue Globally
        run: |
          python3 -c '
          import glob, re

          files = glob.glob("/home/runner/.pub-cache/**/*.gradle", recursive=True) + \
                  glob.glob("/home/runner/.pub-cache/**/*.kts", recursive=True) + \
                  glob.glob("android/**/*.gradle", recursive=True) + \
                  glob.glob("android/**/*.kts", recursive=True)

          for filepath in files:
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  
                  original = content
                  content = re.sub(r"\bmodule\s*\(", "create(", content)
                  
                  if content != original:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
              except Exception as e:
                  pass
          '

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
