name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Clean and Recreate Android Project
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          flutter create . --platforms=android --org com.example
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle 8, Manifest Package, and Namespace for text_to_speech
        run: |
          find ~/.pub-cache -type f \( -name "*.gradle" -o -name "*.groovy" -o -name "*.kts" \) -exec sed -i 's/\.module(/\.create(/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.groovy" -o -name "*.kts" \) -exec sed -i 's/\.module(/\.create(/g' {} +
          
          find ~/.pub-cache -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/1\.3\.50/1.8.22/g' {} +
          find ~/.pub-cache -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/kotlin-gradle-plugin:[0-9.]\+/kotlin-gradle-plugin:1.8.22/g' {} +
          
          find ~/.pub-cache -type f -path "*/text_to_speech-*/android/app/src/main/AndroidManifest.xml" -exec sed -i 's/package="[^"]*"/ /g' {} \;
          find ~/.pub-cache -type f -path "*/text_to_speech-*/android/src/main/AndroidManifest.xml" -exec sed -i 's/package="[^"]*"/ /g' {} \;

          find ~/.pub-cache -type f -path "*/text_to_speech-*/android/build.gradle" | while read file; do
            if ! grep -q "namespace" "$file"; then
              sed -i '/android {/a \    namespace "net.mikespub.flutter.plugins.texttospeech"' "$file"
            fi
          done

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
