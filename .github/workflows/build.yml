name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'

      - name: Clean Project & Remove text_to_speech Completely
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example
          
          # Force Gradle 7.5 for full compatibility with older plugins
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-7.5-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # Remove text_to_speech from pubspec.yaml, delete lock file, and clean dart usages
          python3 -c '
          import os, glob

          pubspec_path = "pubspec.yaml"
          if os.path.exists(pubspec_path):
              with open(pubspec_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              new_lines = []
              skip = False
              for line in lines:
                  if "text_to_speech" in line:
                      skip = True
                      continue
                  if skip:
                      if line.strip() and not line.startswith("  ") and not line.startswith("    "):
                          skip = False
                      else:
                          continue
                  new_lines.append(line)
              
              with open(pubspec_path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          lock_path = "pubspec.lock"
          if os.path.exists(lock_path):
              os.remove(lock_path)
          
          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  if "text_to_speech" in content or "FlutterTts" in content:
                      content = content.replace("text_to_speech", "// text_to_speech")
                      content = content.replace("FlutterTts", "// FlutterTts")
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
              except Exception:
                  pass
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
